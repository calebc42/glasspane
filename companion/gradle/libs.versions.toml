[versions]
agp = "9.1.1"
kotlin = "2.1.10"
compose-bom = "2026.02.01"
activity-compose = "1.10.0"
# Runtime only (tree API, no @Serializable) — the release line for Kotlin 2.1.x.
kotlinx-serialization = "1.8.0"
junit = "4.13.2"
compose-icons = "1.7.8"
# The M3 Expressive line. 1.4.0 (BOM-managed) ships the design TOKENS for
# SplitButton/ButtonGroup/LoadingIndicator/FloatingToolbar/ToggleButton but not
# their composables, and lacks MaterialShapes and FloatingActionButtonMenu
# outright — the catalog's upstream pins this alpha for exactly that reason.
material3 = "1.5.0-alpha16"
# The adaptive line: pane scaffolds and the window size class the catalog's
# adaptive + navigation-suite modules need. Probed compatible with the
# material3 1.5.0-alpha16 / compose 1.11 line before adoption.
adaptive = "1.3.0-alpha09"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# Last standalone release; the icons artifacts left the Compose BOM in 2024.
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose-icons" }
androidx-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
androidx-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "adaptive" }
androidx-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "adaptive" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
